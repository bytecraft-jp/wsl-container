id: ubuntu-kde
title: Ubuntu デスクトップ (KDE)
description: Ubuntu に KDE Plasma デスクトップをインストール。
image: wcs-gui/ubuntu-kde:latest
port: 5800
hostPort: 3500
guiPath: /vnc.html?autoconnect=1&resize=remote
shm: 1g
color: "#1d99f3"
order: 4
build:
  context: .
  requires: [ubuntu-base]
readyCommand: [sh, -c, 'for i in $(seq 1 60); do pgrep -x plasmashell >/dev/null && exit 0; sleep 1; done; exit 1']
