id: thunderbird
title: Thunderbird
description: Ubuntu に Thunderbird と日本語パックをインストール。
image: wcs-gui/thunderbird:latest
port: 5800
hostPort: 5810
guiPath: /vnc.html?autoconnect=1&resize=remote
